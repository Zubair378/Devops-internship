name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-cd.yml'
      - 'devops-week12/tests/**'
      - 'devops-week12/scripts/update_images.py'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install flake8==7.2.0

      - name: Lint with flake8
        run: |
          cd ${{ matrix.service }}
          flake8 . --select=E9,F63,F7,F82

      - name: Run tests
        env:
          TEST_SERVICE: ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          pytest -v
          pytest -v ../devops-week12/tests/test_services.py

  build-and-push:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lowercase repo owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/dockerfile
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Record the images ArgoCD must deploy
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$SOURCE_SHA" origin/main -- backend frontend .github/workflows/ci-cd.yml; then
              echo "Newer application code exists; this older build will not replace it."
              exit 0
            fi
            git checkout -B main origin/main
            python3 devops-week12/scripts/update_images.py "$SOURCE_SHA"
            git add devops-week12/chart/values.yaml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Deploy images from $SOURCE_SHA [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
