apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: microservices-alert-rules
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: microservices.rules
      rules:
        - alert: HighAPILatency
          expr: histogram_quantile(0.95, sum(rate(apiserver_request_duration_seconds_bucket[5m])) by (le)) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High API latency detected"
            description: "95th percentile API server request latency is above 1 second for more than 2 minutes."
        - alert: HighErrorRate
          expr: sum(rate(apiserver_request_total{code=~"5.."}[5m])) / sum(rate(apiserver_request_total[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected"
            description: "More than 5% of API server requests are returning 5xx errors over the last 5 minutes."
        - alert: TargetDown
          expr: up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "A monitored target is down"
            description: "A scrape target has been unreachable for over 1 minute, likely a pod crash or restart loop."
