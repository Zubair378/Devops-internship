dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
configs:
  params:
    server.insecure: true
controller:
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {memory: 384Mi}
repoServer:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
server:
  startupProbe:
    enabled: true
    failureThreshold: 30
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 5
  resources:
    requests: {cpu: 20m, memory: 48Mi}
    limits: {memory: 192Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
