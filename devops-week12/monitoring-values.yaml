alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
grafana:
  replicas: 1
  defaultDashboardsEnabled: false
  # One instance avoids duplicating Grafana's memory during a local upgrade.
  deploymentStrategy: {type: Recreate}
  progressDeadlineSeconds: 900
  # Keep normal health checks, but allow plugin loading on the local demo host.
  startupProbe:
    httpGet: {path: /api/health, port: grafana}
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 512Mi}
  grafana.ini:
    unified_alerting:
      enabled: false
  sidecar:
    resources:
      requests: {cpu: 5m, memory: 32Mi}
      limits: {memory: 128Mi}
    dashboards:
      searchNamespace: ALL
    datasources:
      enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          isDefault: true
          editable: false
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false
prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 48Mi}
    limits: {memory: 192Mi}
prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
    serviceMonitorSelector:
      matchLabels: {release: monitoring}
    serviceMonitorNamespaceSelector: {}
    ruleSelector:
      matchLabels: {release: monitoring}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
defaultRules: {create: false}
kubelet: {enabled: false}
kubeApiServer: {enabled: false}
coreDns: {enabled: false}
kubeDns: {enabled: false}
