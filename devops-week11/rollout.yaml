apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend-rollout
  namespace: default
  labels:
    app: backend
    app.kubernetes.io/part-of: devops-week11
spec:
  replicas: 10
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
  strategy:
    canary:
      canaryService: backend-canary
      stableService: backend-stable
      steps:
        # Step 1: 10% traffic to canary (1 pod out of 10)
        - setWeight: 10
        - pause: { duration: 20s }
        - analysis:
            templates:
              - templateName: prometheus-success-rate
            args:
              - name: service-name
                value: backend-canary
        # Step 2: 30% traffic to canary (3 pods out of 10)
        - setWeight: 30
        - pause: { duration: 20s }
        - analysis:
            templates:
              - templateName: prometheus-success-rate
            args:
              - name: service-name
                value: backend-canary
        # Step 3: 60% traffic to canary (6 pods out of 10)
        - setWeight: 60
        - pause: { duration: 20s }
        - analysis:
            templates:
              - templateName: prometheus-success-rate
            args:
              - name: service-name
                value: backend-canary
        # Step 4: Full promotion to 100%
        - setWeight: 100
